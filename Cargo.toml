[workspace]
resolver = "2"
members = ["apps/desktop"]

# Shared library crates now live in the openbim-core monorepo workspace.
# They are consumed as git-SHA-pinned dependencies from:
#   https://github.com/wildut85523456k/openbim-core
#
# Migration date: 2026-10-27  Core SHA: 544ee0d7c035cb0dffa57f5981094f28fe7ce591

[workspace.package]
edition = "2021"
publish = false

# `full/` was its own workspace that pulled in the private edesign-alike
# electrical solver. With electrical crates now in openbim-core, this
# exclusion is no longer needed but kept for backward compatibility.
exclude = ["full"]
