name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  ifc-checks:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ifcopenshell numpy scipy pytest
      - name: Wall, family and placement scene against IFC
        run: |
          cargo run -q --release -p openbim-place --example place_scene > /tmp/scene.txt
          python spikes/s2b_place_ifc/place_ifc.py /tmp/scene.txt
      - name: Rooms
        run: |
          cargo run -q --release -p openbim-arch --example arch_scene > /tmp/rooms.txt
          python spikes/s5_rooms_ifc/rooms_ifc.py /tmp/rooms.txt
      - name: Layers and envelope
        run: |
          cargo run -q --release -p openbim-arch --example envelope_scene > /tmp/env.txt
          python spikes/s6_layers_ifc/layers_ifc.py /tmp/env.txt
      - name: Ceilings and risers
        run: |
          cargo run -q --release -p openbim-arch --example spaces_scene > /tmp/spaces.txt
          python spikes/s7_spaces_ifc/spaces_ifc.py /tmp/spaces.txt
      - name: Family categories and MEP connectors
        run: |
          cargo run -q --release -p openbim-family --example fan_scene > /tmp/fan.txt
          python spikes/s9_connectors_ifc/connectors_ifc.py /tmp/fan.txt
      - name: Extrusions, revolves and sweeps
        run: |
          cargo run -q --release -p openbim-family --example forms_scene > /tmp/forms.txt
          python spikes/s10_forms_ifc/forms_ifc.py /tmp/forms.txt
      - name: Sketch constraint solver
        run: |
          cargo run -q --release -p openbim-sketch --example sketch_scene > /tmp/sketch.txt
          python spikes/s11_sketch_check/sketch_check.py /tmp/sketch.txt
      - name: IFC written by the app (Rust writer, read back and checked)
        run: |
          cargo build -q --release -p openbim-ifc --example ifc_scene
          E=target/release/examples/ifc_scene
          $E /tmp/w1.ifc > /tmp/w.txt
          $E /tmp/w2.ifc > /dev/null
          $E /tmp/w3.ifc edit > /dev/null
          python spikes/s12_ifc_writer/ifc_writer_check.py /tmp/w.txt /tmp/w1.ifc /tmp/w2.ifc /tmp/w3.ifc
          $E /tmp/v2.ifc ifc2x3 > /dev/null
          python spikes/s12_ifc_writer/ifc2x3_check.py /tmp/v2.ifc /tmp/w1.ifc
          for B in pbp survey shared; do
            BASE=$B $E /tmp/g_$B.ifc > /tmp/g_$B.txt
            python spikes/s12_ifc_writer/georef_base_check.py /tmp/g_$B.txt /tmp/g_$B.ifc $B
          done
      - name: Sheets, printing and Excel sheet sets (PDF/DXF read back independently)
        run: |
          pip install pypdf pypdfium2 ezdxf openpyxl reportlab pillow
          sudo apt-get install -y qpdf poppler-utils
          python -I spikes/s13_sheets_check/check_sheets.py
