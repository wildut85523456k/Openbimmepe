name: printing-regressions
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  GIT_TERMINAL_PROMPT: '0'
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ezdxf==1.4.4 pypdf
      - run: cargo test --locked -p openbim-sheets --release
      - run: cargo clippy --locked -p openbim-sheets --all-targets -- -D warnings
      - name: Portrait PDF and DXF
        run: |
          cargo run --locked -p openbim-sheets --release --example portrait_scene -- "$RUNNER_TEMP/portrait"
          python spikes/s13_sheets_check/check_portrait.py "$RUNNER_TEMP/portrait"
      - name: Full ACI palette and unchanged PDF RGB
        run: |
          python spikes/s13_sheets_check/check_dxf_colours.py make-input "$RUNNER_TEMP/colours"
          cargo run --locked -p openbim-sheets --release --example colour_scene -- "$RUNNER_TEMP/colours/input.csv" "$RUNNER_TEMP/colours"
          python spikes/s13_sheets_check/check_dxf_colours.py check "$RUNNER_TEMP/colours"
      - name: Colour, grayscale and black print modes
        run: |
          cargo run --locked -p openbim-sheets --release --example print_modes_scene -- "$RUNNER_TEMP/modes"
          python spikes/s13_sheets_check/check_print_modes.py "$RUNNER_TEMP/modes"
