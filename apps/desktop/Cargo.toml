[package]
name = "openbim-desktop"
version = "0.0.1"
edition = "2021"
publish = false
description = "Revit-style desktop UI in egui (sample scene only)"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
openbim-keymap = { path = "../../crates/keymap" }
openbim-document = { path = "../../crates/document" }
openbim-oplog = { path = "../../crates/oplog" }
openbim-arch = { path = "../../crates/arch" }
openbim-geom = { path = "../../crates/geom" }
openbim-ifc = { path = "../../crates/ifc" }
openbim-place = { path = "../../crates/place" }
openbim-calc = { path = "../../crates/calc" }
openbim-family = { path = "../../crates/family" }
openbim-route = { path = "../../crates/route" }
openbim-view = { path = "../../crates/view" }
openbim-viewport-egui = { path = "../../crates/viewport-egui" }
openbim-sheets = { path = "../../crates/sheets" }
rfd = "0.17.2"
rayon = "1.10"

[lints.rust]
unsafe_code = "forbid"

[dependencies.openbim-automation]
path = '../../crates/automation'
