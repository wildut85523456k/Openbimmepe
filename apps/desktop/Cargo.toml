[package]
name = "openbim-desktop"
version = "0.0.1"
edition = "2021"
publish = false
description = "Revit-style BIM desktop authoring in egui"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
openbim-keymap = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-commands = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-document = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-oplog = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-arch = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-geom = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-ifc = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
serde_json = "1"
openbim-place = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-calc = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-family = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-route = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-view = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-viewport-egui = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-sheets = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
openbim-clash = { git = "https://github.com/wildut85523456k/openbim-core", rev = "cf77ab580ea027f7566913af66ca4afe28164afc" }
rfd = "0.17.2"
rayon = "1.10"
acadrust = "0.6.8"
cadrum = "0.9"
dxf = "0.6.2"
pdfium-render = "0.9.5"
pdfium-auto = "0.3.1"

[lints.rust]
unsafe_code = "forbid"

[dependencies.openbim-automation]
git = "https://github.com/wildut85523456k/openbim-core"
rev = "cf77ab580ea027f7566913af66ca4afe28164afc"

[package.metadata.bundle]
name = "OpenBIM"
identifier = "com.wildut85523456k.openbim"
version = "0.0.1"
short_description = "Revit-style openBIM desktop authoring"
icon = ["../assets/icon.png", "../assets/icon.ico"]
# Windows: .msi via cargo-bundle native msi crate, macOS: .app/.dmg
resources = ["../assets"]
