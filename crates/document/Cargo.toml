[package]
name = "openbim-document"
version = "0.0.1"
edition = "2021"
publish = false
description = "Initial transactional Rust BIM document core"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openbim-geom = { path = "../geom" }
openbim-route = { path = "../route" }
openbim-family = { path = "../family" }
openbim-place = { path = "../place" }
openbim-calc = { path = "../calc" }
openbim-schematic = { path = "../schematic" }
i_overlay = "4"
earcutr = "0.5.0"
rayon = "1.10"
# SCH-006: read the calculated single-line currents from edesign-alike (pinned at 57ef018), not a
# duplicate calculation engine (clean-room rule). Voltage drop (V, %) is deferred to MEP-002.
openbim-electrical-model = { git = "https://github.com/wildut85523456k/edesign-alike", rev = "57ef01848860771d29960dcf2e8af2f831fe1e6c" }
openbim-electrical-solver = { git = "https://github.com/wildut85523456k/edesign-alike", rev = "57ef01848860771d29960dcf2e8af2f831fe1e6c" }
