[package]
name = "openbim-document"
version = "0.0.1"
edition = "2021"
publish = false
description = "Initial transactional Rust BIM document core"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openbim-geom = { path = "../geom" }
openbim-route = { path = "../route" }
openbim-family = { path = "../family" }
openbim-place = { path = "../place" }
openbim-calc = { path = "../calc" }
openbim-schematic = { path = "../schematic" }
i_overlay = "4"
earcutr = "0.5.0"
rayon = "1.10"
# The electrical solver (edesign-alike) is not a dependency: `electrical_calc` defines the interface
# and the full build in `full/` plugs the solver in. This crate builds without that private repository.
