# The full build: the open workspace plus the edesign-alike electrical solver.
#
# This is a separate workspace with its own Cargo.lock so the main workspace never resolves the
# private repository. Building here needs read access to github.com/wildut85523456k/edesign-alike.
#   cargo run --locked -p openbim-desktop-full
#   cargo test --locked
[workspace]
resolver = "2"
members = ["electrical-adapter", "desktop-full"]

[workspace.dependencies]
openbim-document = { git = "https://github.com/wildut85523456k/openbim-core", rev = "50f634efffdd9dff63aad96b14baa0ac89f3e382" }
openbim-desktop = { path = "../apps/desktop" }
openbim-electrical-model = { git = "https://github.com/wildut85523456k/openbim-core", rev = "50f634efffdd9dff63aad96b14baa0ac89f3e382" }
openbim-electrical-solver = { git = "https://github.com/wildut85523456k/openbim-core", rev = "50f634efffdd9dff63aad96b14baa0ac89f3e382" }
